name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build Akrho.sln --warnaserror
      - run: dotnet test --no-build --verbosity normal

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: src/web/package-lock.json }
      - run: npm ci
        working-directory: src/web
      - run: npm run lint
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
      - run: npm test
        working-directory: src/web

      # Never mark this continue-on-error. It is the only check that actually
      # MOUNTS every route — a parse check is not a load check.
      - run: npm run smoke
        working-directory: src/web
