<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIS — AKRHO Information System · Interactive Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AIS MOCKUP — design tokens
   Palette : records office / member card
   ink      #0E1116  deep       #171D28  brass  #C39A3E
   bond     #E8E5DC  paper      #FFFFFF
   cashin   #2E6B52  cashout    #A6392E
   Type     : Barlow Condensed (signage/display)
              IBM Plex Sans (body/UI)
              IBM Plex Mono (figures, member no.)
   ============================================================ */
:root{
  --ink:#0E1116; --deep:#171D28; --slate:#39424F; --mute:#78828F;
  --brass:#C39A3E; --brass-dk:#8E6D22; --brass-soft:#F0E5CB;
  --bond:#E8E5DC; --paper:#FFFFFF; --line:#DAD6CA;
  --in:#2E6B52; --out:#A6392E; --warn:#B4801E; --info:#2C5C8A;
  --r:10px; --shadow:0 1px 2px rgba(14,17,22,.06),0 8px 24px rgba(14,17,22,.06);
  --f-disp:"Barlow Condensed",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-body);background:var(--ink);color:var(--bond);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- workspace shell ---------- */
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh}

.rail{
  background:var(--deep);border-right:1px solid #232B38;
  padding:20px 0 40px;overflow-y:auto;height:100vh;position:sticky;top:0;
}
.brand{padding:0 20px 18px;border-bottom:1px solid #232B38;margin-bottom:16px}
.brand .seal{
  width:38px;height:38px;border-radius:50%;border:2px solid var(--brass);
  display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;
  color:var(--brass);letter-spacing:.02em;font-size:15px;margin-bottom:10px;
}
.brand h1{font-family:var(--f-disp);font-size:26px;font-weight:600;letter-spacing:.06em;line-height:1}
.brand p{font-size:11px;color:var(--mute);margin-top:5px;letter-spacing:.04em}

.rail-lbl{
  font-family:var(--f-disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brass);padding:16px 20px 7px;
}
.rail a{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 20px;font-size:13.5px;color:#9AA5B3;text-decoration:none;cursor:pointer;
  border-left:2px solid transparent;
}
.rail a:hover{color:var(--paper);background:#1D2532}
.rail a.on{color:var(--paper);background:#1D2532;border-left-color:var(--brass)}
.rail a .tag{
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.04em;color:var(--brass-dk);
  border:1px solid #2E3846;border-radius:3px;padding:1px 4px;
}

.roleswitch{padding:14px 20px 4px}
.roleswitch .rs-lbl{font-size:11px;color:var(--mute);margin-bottom:7px;letter-spacing:.04em}
.rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rs-grid button{
  font-family:var(--f-disp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 4px;border:1px solid #2E3846;border-radius:6px;color:#9AA5B3;
}
.rs-grid button.on{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}

/* ---------- stage ---------- */
.stage{padding:34px 28px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.stage-head{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.stage-head h2{font-family:var(--f-disp);font-size:30px;font-weight:600;letter-spacing:.04em}
.stage-head p{font-size:13px;color:var(--mute);max-width:520px;margin-top:4px;line-height:1.55}
.stamp{
  font-family:var(--f-disp);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--brass);border:1px solid var(--brass-dk);padding:5px 11px;border-radius:4px;white-space:nowrap;
}

/* ---------- device ---------- */
.device{
  width:392px;height:812px;background:var(--ink);border-radius:44px;padding:11px;
  box-shadow:0 0 0 1px #2A323F,0 30px 70px rgba(0,0,0,.55);flex:none;
}
.viewport{
  width:100%;height:100%;background:var(--bond);border-radius:34px;overflow:hidden;
  position:relative;display:flex;flex-direction:column;color:var(--ink);
}
.statusbar{
  height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-family:var(--f-num);font-size:11px;color:var(--slate);
  background:var(--paper);border-bottom:1px solid var(--line);
}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain}
.screen::-webkit-scrollbar{width:0}

/* ---------- app chrome ---------- */
.appbar{
  position:sticky;top:0;z-index:5;background:var(--deep);color:var(--paper);
  padding:13px 16px;display:flex;align-items:center;gap:11px;
}
.appbar .back{font-size:19px;line-height:1;color:var(--brass)}
.appbar h3{font-family:var(--f-disp);font-size:20px;font-weight:600;letter-spacing:.05em;flex:1}
.appbar .act{font-size:12px;color:var(--brass);letter-spacing:.03em}
.subbar{background:#20293650;padding:7px 16px;font-size:11px;color:var(--mute);
  border-bottom:1px solid var(--line);background:var(--paper);letter-spacing:.02em}

.tabnav{
  flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);
  border-top:1px solid var(--line);padding:7px 0 12px;
}
.tabnav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute)}
.tabnav button .ic{font-size:17px;line-height:1}
.tabnav button .tl{font-family:var(--f-disp);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase}
.tabnav button.on{color:var(--ink)}
.tabnav button.on .tl{color:var(--brass-dk);font-weight:600}

/* ---------- content primitives ---------- */
.pad{padding:16px}
.sec-lbl{
  font-family:var(--f-disp);font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--slate);margin:20px 16px 8px;display:flex;justify-content:space-between;align-items:center;
}
.sec-lbl:first-child{margin-top:16px}
.sec-lbl a{color:var(--brass-dk);font-size:11px;letter-spacing:.06em;text-transform:none;font-family:var(--f-body)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin:0 16px 10px;overflow:hidden}
.card-pad{padding:14px}
.row{
  display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--paper);
  border-bottom:1px solid var(--line);cursor:pointer;
}
.row:last-child{border-bottom:none}
.row:active{background:#F6F4EE}
.row .grow{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.row .s{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.4}
.row .amt{font-family:var(--f-num);font-size:13.5px;font-weight:500;white-space:nowrap}
.chev{color:var(--line);font-size:16px}

.avatar{
  width:42px;height:42px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-family:var(--f-disp);font-size:17px;font-weight:600;letter-spacing:.03em;
  background:var(--deep);color:var(--brass-soft);
}
.avatar.sm{width:32px;height:32px;font-size:13px;border-radius:6px}
.avatar.lg{width:78px;height:78px;font-size:30px;border-radius:12px}

.pill{
  display:inline-block;font-family:var(--f-num);font-size:10px;letter-spacing:.05em;
  padding:2px 6px;border-radius:4px;border:1px solid;vertical-align:middle;
}
.p-blood{color:var(--out);border-color:#E4C4C0;background:#FBF0EF}
.p-ok{color:var(--in);border-color:#C3DBD0;background:#EEF6F2}
.p-warn{color:var(--warn);border-color:#E8D6AC;background:#FBF5E7}
.p-mute{color:var(--mute);border-color:var(--line);background:#F4F2EC}
.p-info{color:var(--info);border-color:#C3D4E4;background:#EFF4F9}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{
  font-size:11px;padding:2px 7px;border-radius:11px;background:var(--brass-soft);
  color:var(--brass-dk);border:1px solid #E2D2AC;
}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px}
.tile{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px;cursor:pointer;
}
.tile:active{background:#F6F4EE}
.tile .k{font-family:var(--f-disp);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile .v{font-family:var(--f-num);font-size:20px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.tile .d{font-size:11px;color:var(--mute);margin-top:3px}
.tile.wide{grid-column:1/-1}
.tile.dark{background:var(--deep);border-color:var(--deep);color:var(--bond)}
.tile.dark .k{color:var(--brass)}
.tile.dark .v{color:var(--paper);font-size:27px}

/* forms */
.field{padding:0 16px 13px}
.field label{
  display:block;font-family:var(--f-disp);font-size:12px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--slate);margin-bottom:5px;
}
.field .ctl{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;
  background:var(--paper);font-size:14px;color:var(--ink);
}
.field .ctl:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}
.field .hint{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.4}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 13px}
.field2 .field{padding:0}

.btn{
  display:block;width:calc(100% - 32px);margin:6px 16px 10px;padding:13px;
  background:var(--deep);color:var(--paper);border-radius:8px;text-align:center;
  font-family:var(--f-disp);font-size:16px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
}
.btn:active{background:#000}
.btn.brass{background:var(--brass);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--slate)}
.btn.danger{background:var(--out)}
.btn.sm{padding:9px;font-size:13.5px}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px}
.btn-pair .btn{width:100%;margin:0}

.note{
  margin:0 16px 12px;padding:11px 13px;border-radius:8px;font-size:12.5px;line-height:1.5;
  background:#FBF5E7;border:1px solid #E8D6AC;color:#6B4E12;
}
.note.info{background:#EFF4F9;border-color:#C3D4E4;color:#1F4568}
.note strong{font-weight:600}

.empty{padding:44px 30px;text-align:center;color:var(--mute)}
.empty .ic{font-size:30px;opacity:.35;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}

.divider{height:1px;background:var(--line);margin:14px 16px}

/* search + filters */
.searchwrap{padding:12px 16px 8px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:47px;z-index:4}
.searchwrap input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--bond);font-size:14px;
}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 16px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-size:12px;padding:5px 11px;border-radius:15px;border:1px solid var(--line);
  background:var(--paper);color:var(--slate);white-space:nowrap;
}
.chip.on{background:var(--deep);border-color:var(--deep);color:var(--brass-soft);font-weight:500}

/* ---------- SIGNATURE: member card ---------- */
.idstage{padding:20px 16px 8px;perspective:1400px}
.idcard{
  position:relative;width:100%;aspect-ratio:1.586/1;transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.4,.1,.2,1);cursor:pointer;
}
.idcard.flip{transform:rotateY(180deg)}
.idface{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden;
  background:
    repeating-linear-gradient(115deg,rgba(195,154,62,.07) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(-115deg,rgba(195,154,62,.06) 0 1px,transparent 1px 9px),
    radial-gradient(120% 150% at 82% -10%,#28303E 0%,#141A24 55%,#0C1017 100%);
  border:1px solid #333C4A;box-shadow:0 14px 34px rgba(0,0,0,.4);color:var(--bond);
}
.idface.back{transform:rotateY(180deg)}
.id-top{display:flex;align-items:center;gap:9px;padding:12px 14px 0}
.id-seal{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brass);
  display:grid;place-items:center;font-family:var(--f-disp);font-size:11px;
  color:var(--brass);font-weight:700;flex:none;
}
.id-org{font-family:var(--f-disp);font-size:13px;letter-spacing:.22em;color:var(--brass);line-height:1.2}
.id-org small{display:block;font-size:9px;letter-spacing:.13em;color:#7E8895;font-family:var(--f-body)}
.id-body{display:flex;gap:12px;padding:11px 14px}
.id-photo{
  width:66px;height:80px;border-radius:6px;flex:none;background:#2A323F;
  border:1px solid #3A4453;display:grid;place-items:center;font-family:var(--f-disp);
  font-size:25px;color:var(--brass-soft);
}
.id-fields{flex:1;min-width:0}
.id-gift{font-family:var(--f-disp);font-size:25px;letter-spacing:.05em;line-height:1;color:var(--paper)}
.id-name{font-size:11.5px;color:#98A2B0;margin-top:3px}
.id-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:9px}
.id-meta div{min-width:0}
.id-meta .k{font-family:var(--f-disp);font-size:9px;letter-spacing:.15em;color:#6F7A88;text-transform:uppercase}
.id-meta .v{font-family:var(--f-num);font-size:11px;color:var(--brass-soft);margin-top:1px}
.id-strip{
  position:absolute;bottom:0;left:0;right:0;padding:6px 14px;background:rgba(195,154,62,.13);
  border-top:1px solid rgba(195,154,62,.3);display:flex;justify-content:space-between;
  font-family:var(--f-num);font-size:9.5px;letter-spacing:.06em;color:var(--brass);
}
.id-back-in{padding:14px;display:flex;gap:12px;height:100%}
.qr{
  width:88px;height:88px;flex:none;border-radius:6px;background:var(--paper);padding:6px;
  display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:1.5px;
}
.qr i{background:var(--ink);border-radius:1px}
.qr i.off{background:transparent}
.id-back-txt{flex:1;font-size:10px;line-height:1.5;color:#98A2B0}
.id-back-txt b{display:block;font-family:var(--f-disp);font-size:12px;letter-spacing:.16em;
  color:var(--brass);text-transform:uppercase;margin-bottom:5px}
.flip-hint{text-align:center;font-size:11.5px;color:var(--mute);margin-top:11px;letter-spacing:.03em}

/* year seal + renewal */
.id-year{position:absolute;right:13px;top:44px;width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;border:2px solid #E8CE8E;
  background:radial-gradient(120% 120% at 30% 20%,#E8CE8E 0%,#C39A3E 45%,#8E6D22 100%)}
.id-year b{font-family:var(--f-disp);font-size:19px;color:#3A2C0A;line-height:1}
.id-year i{position:absolute;bottom:6px;font-family:var(--f-disp);font-size:7px;
  letter-spacing:.1em;color:#3A2C0A;font-style:normal}
.seals{display:flex;gap:10px;flex-wrap:wrap;padding:2px}
.seal{width:66px;text-align:center}
.seal .disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;position:relative;
  border:2px solid #E8CE8E;box-shadow:0 3px 8px rgba(0,0,0,.18);
  background:radial-gradient(120% 120% at 30% 20%,#E8CE8E 0%,#C39A3E 45%,#8E6D22 100%)}
.seal .disc span{font-family:var(--f-disp);font-size:20px;font-weight:700;color:#3A2C0A}
.seal .disc:after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(58,44,10,.35)}
.seal.gap .disc{background:#EDEBE5;border:2px dashed var(--line);box-shadow:none}
.seal.gap .disc span{color:#B8B4AA}
.seal.silver .disc{border-color:#F2F3F5;
  background:radial-gradient(120% 120% at 30% 20%,#F2F3F5 0%,#B9BEC6 45%,#7C838D 100%)}
.seal.silver .disc span{color:#2F343B;font-size:15px}
.seal .cap{font-size:9.5px;color:var(--mute);margin-top:4px}

/* chapter identity — the app is national, the chapter is who you belong to */
.chmark{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-family:var(--f-disp);font-size:13px;font-weight:600;letter-spacing:.02em;
  background:var(--chapter-accent,#2E5C8A);color:#fff;border:1px solid rgba(255,255,255,.22)}
.chmark.lg{width:56px;height:56px;font-size:21px;border-radius:12px}
.chmark.sm{width:22px;height:22px;font-size:9px;border-radius:5px}

/* cascading hierarchy picker */
.chain{margin:0 16px 12px;padding:12px 14px;border-radius:10px;background:var(--paper);
  border:1px solid var(--line)}
.chain .step{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.chain .rung{width:22px;flex:none;display:flex;flex-direction:column;align-items:center}
.chain .dot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:5px}
.chain .dot.on{background:var(--brass)}
.chain .dot.me{background:var(--deep);box-shadow:0 0 0 3px var(--brass-soft)}
.chain .line{flex:1;width:2px;background:var(--line);min-height:14px}
.chain .lvl{font-family:var(--f-disp);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute)}
.chain .val{font-size:13.5px;color:var(--ink);margin-top:1px;font-weight:500}
.chain .val.pending{color:var(--mute);font-weight:400;font-style:italic}

/* commemorative year cards — one finish per year */
.yc{width:100%;aspect-ratio:1.586/1;border-radius:14px;position:relative;overflow:hidden;
  color:#EDEAE2;box-shadow:0 12px 30px rgba(0,0,0,.32)}
.yc .pat{position:absolute;inset:0;opacity:.16}
.yc .in{position:relative;padding:14px 16px;height:100%;display:flex;flex-direction:column}
.yc .org{font-family:var(--f-disp);font-size:11px;letter-spacing:.24em;opacity:.85}
.yc .big{font-family:var(--f-disp);font-size:60px;font-weight:700;line-height:.9;margin-top:auto;letter-spacing:-.01em}
.yc .span{font-family:var(--f-num);font-size:10.5px;letter-spacing:.12em;opacity:.8;margin-top:3px}
.yc .who{font-family:var(--f-disp);font-size:21px;letter-spacing:.05em;margin-top:9px}
.yc .no{font-family:var(--f-num);font-size:9.5px;opacity:.7;margin-top:2px}
.yc .emb{position:absolute;right:14px;top:14px;width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--f-disp);font-size:15px;font-weight:700}
.yc .thm{position:absolute;right:16px;bottom:14px;text-align:right;font-family:var(--f-disp);
  font-size:12px;letter-spacing:.16em;opacity:.9;max-width:44%;line-height:1.3}
/* finishes */
.yc-brass{background:radial-gradient(120% 150% at 80% -10%,#2C3546 0%,#151B25 55%,#0B0E14 100%)}
.yc-brass .pat{background:repeating-linear-gradient(115deg,#C39A3E 0 1px,transparent 1px 8px),
  repeating-linear-gradient(-115deg,#C39A3E 0 1px,transparent 1px 10px)}
.yc-brass .big,.yc-brass .org,.yc-brass .thm{color:#E3C179}
.yc-brass .emb{background:linear-gradient(145deg,#E8CE8E,#8E6D22);color:#2B2007}
.yc-jade{background:radial-gradient(120% 150% at 20% -10%,#1C4038 0%,#0F2721 55%,#08150F 100%)}
.yc-jade .pat{background:repeating-linear-gradient(90deg,#7FD3B0 0 1px,transparent 1px 11px),
  repeating-linear-gradient(0deg,#7FD3B0 0 1px,transparent 1px 11px)}
.yc-jade .big,.yc-jade .org,.yc-jade .thm{color:#9FE0C2}
.yc-jade .emb{background:linear-gradient(145deg,#EFF2F3,#8A939B);color:#12261F}

const TABBED = ["home","dash","directory","meetings","ledger","expenses","donations","memos","announce","cases"];
const TABMAP = {home:"home",dash:"more",directory:"directory",crosschapter:"directory",
  meetings:"meetings",meeting:"meetings",ledger:"ledger",expenses:"ledger",donations:"ledger",
  announce:"more",memos:"more",cases:"more"};

function railHTML(){
  return NAV.map(g => `
    <div class="rail-lbl">${g.grp}</div>
    ${g.items.map(([r,l,t]) => `
      <a class="${S.route===r?"on":""}" onclick="go('${r}')">
        <span>${l}</span>${t?`<span class="tag">${t==="sig"?"★":t}</span>`:""}
      </a>`).join("")}`).join("");
}

function render(){
  const r = V[S.route] ? S.route : "login";
  $("#screen").innerHTML = V[r]();
  $("#tabs").innerHTML = TABBED.includes(r) ? tabs(TABMAP[r]||r) : "";
  $("#railNav").innerHTML = railHTML();
  const m = META[r] || ["","",""];
  $("#stageTitle").textContent = m[0];
  $("#stageDesc").textContent = m[1];
  $("#stageStamp").textContent = m[2];
  $("#caption").innerHTML = `Preview as <b>${
    {member:"Member",officer:"Officer",admin:"Chapter Admin",guest:"Not signed in"}[S.role]
  }</b> — switch roles on the left to see how the same screen changes.`;
}
function syncRole(){
  document.querySelectorAll("#roleGrid button").forEach(b =>
    b.classList.toggle("on", b.dataset.role === S.role));
}
document.getElementById("roleGrid").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  S.role = b.dataset.role; syncRole();
  if(S.role === "guest" && !["login","register","pending"].includes(S.route)) S.route = "login";
  if(S.role !== "guest" && ["login","register","pending"].includes(S.route)) S.route = "home";
  render();
});
render();
