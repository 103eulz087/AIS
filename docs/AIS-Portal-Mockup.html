<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKRHO Central Portal — Renewal Module · Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1116;--deep:#171D28;--slate:#39424F;--mute:#78828F;
  --brass:#C39A3E;--brass-dk:#8E6D22;--brass-soft:#F0E5CB;
  --bond:#EFEEEA;--paper:#FFFFFF;--line:#DCDAD3;
  --in:#2E6B52;--out:#A6392E;--warn:#B4801E;--info:#2C5C8A;
  --f-disp:"Barlow Condensed",sans-serif;--f-body:"IBM Plex Sans",sans-serif;--f-num:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);background:var(--ink);color:#DAD8D1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}

.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.rail{background:var(--deep);border-right:1px solid #232B38;padding:18px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 18px 16px;border-bottom:1px solid #232B38;margin-bottom:12px}
.brand .seal{width:34px;height:34px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:700;color:var(--brass);font-size:13px;margin-bottom:9px}
.brand h1{font-family:var(--f-disp);font-size:21px;letter-spacing:.09em;color:#fff;line-height:1.05}
.brand p{font-size:10.5px;color:var(--mute);margin-top:4px;letter-spacing:.03em}
.rl{font-family:var(--f-disp);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);padding:14px 18px 6px}
.rail a{display:block;padding:7px 18px;font-size:13px;color:#98A2B0;text-decoration:none;cursor:pointer;border-left:2px solid transparent}
.rail a:hover{color:#fff;background:#1D2532}
.rail a.on{color:#fff;background:#1D2532;border-left-color:var(--brass)}
.rs{padding:12px 18px 4px}
.rs .l{font-size:10.5px;color:var(--mute);margin-bottom:6px}
.rs button{display:block;width:100%;text-align:left;font-size:12px;padding:6px 9px;border:1px solid #2E3846;
  border-radius:6px;color:#98A2B0;margin-bottom:4px}
.rs button.on{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}

.stage{padding:26px 26px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
.head{width:100%;max-width:1180px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.head h2{font-family:var(--f-disp);font-size:27px;letter-spacing:.03em;color:#fff}
.head p{font-size:12.5px;color:var(--mute);max-width:640px;margin-top:3px;line-height:1.55}
.stamp{font-family:var(--f-disp);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);
  border:1px solid var(--brass-dk);padding:4px 10px;border-radius:4px;white-space:nowrap}

.browser{width:100%;max-width:1180px;background:var(--bond);border-radius:12px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5);color:var(--ink)}
.bbar{display:flex;align-items:center;gap:9px;padding:9px 14px;background:#DDDBD4;border-bottom:1px solid var(--line)}
.bbar .d{width:11px;height:11px;border-radius:50%;background:#C5C2B9}
.bbar .url{flex:1;background:#fff;border-radius:14px;padding:5px 12px;font-family:var(--f-num);font-size:11px;color:var(--slate)}
.page{min-height:640px}

/* portal chrome */
.topbar{background:var(--deep);color:#fff;padding:13px 22px;display:flex;align-items:center;gap:14px}
.topbar .seal{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--brass);display:grid;place-items:center;
  font-family:var(--f-disp);font-size:12px;color:var(--brass);font-weight:700;flex:none}
.topbar h3{font-family:var(--f-disp);font-size:18px;letter-spacing:.1em;flex:1}
.topbar .who{text-align:right;font-size:11.5px;line-height:1.4}
.topbar .who b{display:block;font-size:12.5px;color:var(--brass)}
.crumb{background:var(--paper);border-bottom:1px solid var(--line);padding:9px 22px;font-size:11.5px;color:var(--mute)}
.crumb b{color:var(--slate)}
.body{padding:22px}

.h1{font-family:var(--f-disp);font-size:26px;letter-spacing:.02em;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--mute);margin-bottom:18px;line-height:1.55}
.sl{font-family:var(--f-disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);
  margin:22px 0 9px;display:flex;justify-content:space-between;align-items:center}
.sl:first-child{margin-top:0}

.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cp{padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}

.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .k{font-family:var(--f-disp);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.tile .v{font-family:var(--f-num);font-size:23px;font-weight:600;margin-top:5px}
.tile .d{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.4}
.tile.dark{background:var(--deep);border-color:var(--deep);color:#DAD8D1}
.tile.dark .k{color:var(--brass)}.tile.dark .v{color:#fff;font-size:28px}.tile.dark .d{color:#8B95A3}

table{width:100%;border-collapse:collapse;background:var(--paper);font-size:12.5px}
th{font-family:var(--f-disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#F7F6F3;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F6F3}
td.num{font-family:var(--f-num);text-align:right;white-space:nowrap}
th.num{text-align:right}

.pill{display:inline-block;font-family:var(--f-num);font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
.p-ok{color:var(--in);border-color:#C3DBD0;background:#EEF6F2}
.p-warn{color:#8A6410;border-color:#E8D6AC;background:#FBF5E7}
.p-bad{color:var(--out);border-color:#E4C4C0;background:#FBF0EF}
.p-info{color:var(--info);border-color:#C3D4E4;background:#EFF4F9}
.p-mute{color:var(--mute);border-color:var(--line);background:#F4F2EC}

.btn{display:inline-block;padding:9px 18px;border-radius:7px;font-family:var(--f-disp);font-size:14px;
  letter-spacing:.11em;text-transform:uppercase;font-weight:600;background:var(--deep);color:#fff}
.btn.brass{background:var(--brass);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--slate)}
.btn.danger{background:var(--out);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.note{padding:12px 14px;border-radius:8px;font-size:12px;line-height:1.55;background:#FBF5E7;border:1px solid #E8D6AC;color:#6B4E12}
.note.info{background:#EFF4F9;border-color:#C3D4E4;color:#1F4568}
.note.bad{background:#FBF0EF;border-color:#E4C4C0;color:#7A2A22}
.note b{font-weight:600}

.cbx{width:19px;height:19px;border-radius:4px;border:1.5px solid var(--line);display:inline-grid;place-items:center;
  font-size:11px;color:transparent;background:#fff;cursor:pointer;vertical-align:middle}
.cbx.on{background:var(--deep);border-color:var(--deep);color:var(--brass)}

.av{width:30px;height:30px;border-radius:6px;background:var(--deep);color:var(--brass-soft);display:inline-grid;
  place-items:center;font-family:var(--f-disp);font-size:12px;vertical-align:middle;margin-right:8px}

/* organization tree */
.tree{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tnode{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.tnode:last-child{border-bottom:none}
.tnode:hover{background:#F7F6F3}
.tnode .rail{display:flex;align-items:center;flex:none}
.tnode .tick{width:10px;height:10px;border-radius:50%;background:var(--brass)}
.tnode .stub{width:18px;height:2px;background:var(--line)}
.tnode .nm{font-size:13px;font-weight:600}
.tnode .sub{font-size:11px;color:var(--mute);margin-top:2px}
.tnode .lvl{font-family:var(--f-disp);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.chmark{width:30px;height:30px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-family:var(--f-disp);font-size:12px;font-weight:600;color:#fff}
.prereq{display:flex;gap:0;align-items:stretch;margin-bottom:14px}
.prereq .p{flex:1;padding:11px 13px;border:1px solid var(--line);background:var(--paper)}
.prereq .p:first-child{border-radius:9px 0 0 9px}
.prereq .p:last-child{border-radius:0 9px 9px 0}
.prereq .p + .p{border-left:none}
.prereq .p.ok{background:#EEF6F2;border-color:#C3DBD0}
.prereq .p.now{background:var(--deep);border-color:var(--deep)}
.prereq .p.blocked{background:#F4F2EC}
.prereq .lv{font-family:var(--f-disp);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.prereq .p.now .lv{color:var(--brass)}
.prereq .st{font-size:12.5px;font-weight:600;margin-top:4px}
.prereq .p.now .st{color:#fff}

/* escalation ladder */
.ladder{display:flex;align-items:stretch;gap:0}
.step{flex:1;padding:13px;border:1px solid var(--line);background:var(--paper);position:relative}
.step:first-child{border-radius:9px 0 0 9px}
.step:last-child{border-radius:0 9px 9px 0}
.step+.step{border-left:none}
.step .lv{font-family:var(--f-disp);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.step .st{font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.35}
.step .dt{font-family:var(--f-num);font-size:10.5px;color:var(--mute);margin-top:5px}
.step.done{background:#EEF6F2;border-color:#C3DBD0}
.step.now{background:var(--deep);border-color:var(--deep)}
.step.now .lv{color:var(--brass)}.step.now .st{color:#fff}.step.now .dt{color:#8B95A3}
.step.arm{background:#FBF5E7;border-color:#E8D6AC}

/* BADGE SYSTEM */
.seals{display:flex;gap:11px;flex-wrap:wrap}
.seal{width:78px;text-align:center}
.seal .disc{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(120% 120% at 30% 20%,#E8CE8E 0%,#C39A3E 45%,#8E6D22 100%);
  border:2px solid #E8CE8E;box-shadow:0 3px 9px rgba(0,0,0,.2)}
.seal .disc span{font-family:var(--f-disp);font-size:23px;font-weight:700;color:#3A2C0A;letter-spacing:.02em}
.seal .disc:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(58,44,10,.35)}
.seal.gap .disc{background:#EDEBE5;border:2px dashed var(--line);box-shadow:none}
.seal.gap .disc span{color:#B8B4AA}
.seal .cap{font-size:10px;color:var(--mute);margin-top:5px}
.seal.silver .disc{background:radial-gradient(120% 120% at 30% 20%,#F2F3F5 0%,#B9BEC6 45%,#7C838D 100%);border-color:#F2F3F5}
.seal.silver .disc span{color:#2F343B;font-size:17px}

.idcard{width:330px;aspect-ratio:1.586/1;border-radius:12px;position:relative;overflow:hidden;color:#DAD8D1;
  background:radial-gradient(120% 150% at 82% -10%,#28303E 0%,#141A24 55%,#0C1017 100%);border:1px solid #333C4A}
.idcard .gl{position:absolute;inset:0;opacity:.09;
  background:repeating-linear-gradient(115deg,var(--brass) 0 1px,transparent 1px 7px),
             repeating-linear-gradient(-115deg,var(--brass) 0 1px,transparent 1px 9px)}
.idcard .in{position:relative;padding:11px 13px}
.idcard .org{font-family:var(--f-disp);font-size:11px;letter-spacing:.2em;color:var(--brass)}
.idcard .gift{font-family:var(--f-disp);font-size:25px;letter-spacing:.04em;color:#fff;margin-top:6px;line-height:1}
.idcard .nm{font-size:10.5px;color:#98A2B0;margin-top:2px}
.idcard .yr{position:absolute;right:12px;top:36px;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(120% 120% at 30% 20%,#E8CE8E 0%,#C39A3E 45%,#8E6D22 100%);
  display:grid;place-items:center;border:2px solid #E8CE8E}
.idcard .yr b{font-family:var(--f-disp);font-size:20px;color:#3A2C0A}
.idcard .yr i{position:absolute;bottom:7px;font-family:var(--f-disp);font-size:7.5px;letter-spacing:.1em;color:#3A2C0A;font-style:normal}
.idcard .strip{position:absolute;left:0;right:0;bottom:0;padding:5px 13px;background:rgba(195,154,62,.14);
  border-top:1px solid rgba(195,154,62,.3);display:flex;justify-content:space-between;
  font-family:var(--f-num);font-size:8.5px;letter-spacing:.05em;color:var(--brass)}
.idcard.lapsed{filter:grayscale(1) brightness(.72)}
.idcard.lapsed .yr{background:#6E6E6E;border-color:#9A9A9A}

.legend{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--slate);margin-top:8px}
.bar{height:9px;border-radius:5px;background:#E5E3DC;overflow:hidden;min-width:90px;flex:1}
.bar i{display:block;height:100%;background:var(--in)}
.caption{max-width:1180px;font-size:12px;line-height:1.6;color:var(--mute);text-align:center}
.caption b{color:var(--brass);font-weight:500}
@media (max-width:980px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto}.g4,.g3,.g2,.g21{grid-template-columns:1fr}}
</style>
</head>

const WORDS=n=>{const o=["","one","two","three","four","five","six","seven","eight","nine"];
  const h=Math.floor(n/100),t=n%100;let w=h?o[h]+" hundred":"";
  if(t){const ty=["","ten","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
    const te=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
    const p=t<20&&t>=10?te[t-10]:(ty[Math.floor(t/10)]+(t%10?"-"+o[t%10]:""));
    w=w?w+" "+p:p;}
  return (w||"zero").replace(/^./,c=>c.toUpperCase());};

V.attached=()=>portalTop()+crumb("Approval routing")+`<div class="body">
  <div class="h1">Who is approving what</div>
  <div class="sub">One rule covers bootstrap, expansion, dormancy and delay:
    <b>an application is approved by the nearest existing ancestor with seated officers.</b></div>

  <div class="card" style="background:var(--deep);border-color:var(--deep);margin-bottom:18px">
    <div class="cp">
      <div style="font-family:var(--f-disp);font-size:12px;letter-spacing:.2em;color:var(--brass)">THE RULE</div>

  <div class="sl" style="margin-top:0">Currently routing elsewhere</div>
  <div class="card"><table>

       ["10 chapters in San Pedro","San Pedro City Council","Laguna Provincial Council","No officers seated since Aug 2026","p-bad"],
       ["Brgy. Pooc Chapter","Sta. Rosa City Council","Sta. Rosa City Council","Parent — normal","p-ok"]]
      .map(([sub,should,act,why,k])=>`
      <tr><td><b>${sub}</b></td>

        <td><b>${act}</b></td>

    are not the same problem.</b> Cabuyao has no council because it has only just grown chapters —
    the province creates one as soon as there are members to seat. San Pedro has a council that
    nobody is running, and the fix there is to seat officers, not to create anything.</div>

  <div class="sl">Jurisdictions carrying chapters without their own council</div>
  <div class="card"><table>
    <tr><th>Council carrying them</th><th>Unserved jurisdiction</th><th class="num">Chapters</th><th>Members available to seat</th><th></th></tr>
    ${[["Laguna Provincial","Cabuyao City",4,"31 — enough to seat six",1],
       ["Laguna Provincial","San Pedro City",10,"council exists, nobody seated",0],
       ["Region IV-A","Quezon Province",6,"48 — enough to seat six",1],

  <div class="note" style="margin-top:14px"><b>This is information, not a deadline.</b> A council can
    be created the moment there are members to seat, and never before. Nothing expires and nothing is
    forced. But a province quietly carrying twenty chapters that should have had their own council is
    a workload and legitimacy problem that stays invisible until renewal season — so it is surfaced
    at three chapters, and left to the National Council to act on.</div>

  <div class="note bad" style="margin-top:14px"><b>Alaminos shows the limit of the jurisdiction rule.</b>

        <td style="font-size:12px;color:var(--mute)">${ch}</td>

  <div class="card"><table>
    <tr><th>Brother</th><th>Member no.</th><th>Chapter of record</th><th>Why</th><th>Renewal</th><th></th></tr>

       ["SIGWA","Michael A. Rosales","AKR-04-0126-002","Brgy. Sto. Domingo","Chapter dissolved 2022","lapsed 2026"]]
      .map(([g,n,no,ch,why,rn])=>`
      <tr><td><b>${g}</b><div style="font-size:11px;color:var(--mute)">${n}</div></td>
        <td class="num" style="font-size:11.5px">${no}</td>
        <td style="font-size:12px">${ch}</td>
        <td style="font-size:12px;color:var(--slate)">${why}</td>
        <td><span class="pill ${rn==="renewed"?"p-ok":"p-bad"}">${rn}</span></td>
        <td style="text-align:right"><button class="btn ghost sm"
          onclick="alert('Transfers him into a registered chapter. His years, seals and history follow him.')">Transfer</button></td></tr>`).join("")}
  </table></div>
  <div class="note info" style="margin-top:14px"><b>Unrelated to bootstrap.</b> These two were created
    by chapters that later stopped functioning. Detaching is not enrolment — a council still cannot
    create anybody. The real fix is usually reviving the chapter, not relocating the brother.</div>
</div>`;

V.newCouncil=()=>{
  const mode = S.councilMode || "constitute";
  return portalTop()+crumb("Council registration")+`<div class="body">
  <div class="h1">Register a council</div>
  <div class="sub">A council is an organ of the level above it, so it is normally constituted from
    above rather than petitioned from below. Both routes exist; they differ in who starts it, not in
    who approves it.</div>

  <div class="chips" style="display:flex;gap:8px;margin-bottom:16px">
    <button class="btn ${mode==="constitute"?"brass":"ghost"} sm"
      onclick="S.councilMode='constitute';render()">Constituted from above</button>
    <button class="btn ${mode==="petition"?"brass":"ghost"} sm"
      onclick="S.councilMode='petition';render()">Petitioned from below</button>
    <button class="btn ${mode==="reconstitute"?"brass":"ghost"} sm"
      onclick="S.councilMode='reconstitute';render()">Reconstitute a dormant council</button>
  </div>

  ${mode==="constitute" ? `
    <div class="note info" style="margin-bottom:16px"><b>Laguna Provincial Council is creating a new
      city council.</b> This is the usual route: a jurisdiction exists, the province seats officers,
      and chapters attach to it afterwards. <b>A council is created empty</b> — unlike a chapter,
      it does not need members of its own to exist.</div>` : ""}
  ${mode==="petition" ? `
    <div class="note" style="margin-bottom:16px"><b>Chapters in an unserved city are petitioning to
      constitute their own council.</b> This route needs a public form, because the petitioning
      chapters have accounts in AIS but no council account to file from. It is approved by the same
      body either way — the province — and the officers still come from the same dropdown.</div>` : ""}
  ${mode==="reconstitute" ? `
    <div class="note bad" style="margin-bottom:16px"><b>Reconstitution is not creation.</b> The
      council row, its history, its past approvals and its chapters all remain. Only the officers
      change. <b>A council is never deleted</b> — every chapter, renewal and receipt beneath it
      references it forever.</div>` : ""}

  <div class="sl" style="margin-top:0">The chain above must already exist</div>
  <div class="prereq">

    exists in its jurisdiction — that is what guarantees the officer dropdown has somebody in it, and
    a council with no chapters governs nothing anyway.

    nearest existing ancestor. Nothing was blocked while waiting.</div>

  <div class="grid g21" style="margin-top:18px">
    <div>
      <div class="sl" style="margin-top:0">1 · Jurisdiction</div>
      <div class="card"><div class="cp"><div class="grid g2">
        <div><div style="font-size:12px;color:var(--slate);margin-bottom:5px">Council name</div>

      </div>
      <div style="height:12px"></div>
      <div class="grid g2">
        <div><div style="font-size:12px;color:var(--slate);margin-bottom:5px">Parent council</div>
          <select style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px"><option>Laguna Provincial Council</option></select></div>
        <div><div style="font-size:12px;color:var(--slate);margin-bottom:5px">Term of office</div>
          <input value="09 Aug ${YEAR} — 08 Aug ${YEAR+1}"
            style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-family:var(--f-num);font-size:12px"></div>
      </div></div></div>

      <div class="sl">2 · Seated officers <span class="pill p-info">select — no typing</span></div>
      <div class="card"><table>
        <tr><th style="width:170px">Office</th><th>Brother</th><th>Home chapter</th><th class="num">Status</th></tr>
        ${COUNCIL_OFFICES.map(([off,,lvl],i)=>{
          const picked = S.seats && S.seats[i] ? [...ELIGIBLE,...OUTSIDE].find(m=>m.id===+S.seats[i]) : null;
          const isOut = picked && !ELIGIBLE.some(m=>m.id===picked.id);
          const taken = Object.entries(S.seats||{}).filter(([k])=>+k!==i).map(([,v])=>+v);
          const opt = m => `<option value="${m.id}" ${picked&&picked.id===m.id?"selected":""}
             ${taken.includes(m.id)?"disabled":""}>${m.gift} — ${m.name} (${m.ch})${taken.includes(m.id)?" · already seated":""}</option>`;
          return `<tr>
            <td><b>${off}</b>
              <div style="margin-top:3px"><span class="pill ${lvl==="admin"?"p-ok":lvl==="read"?"p-warn":"p-info"}">
                ${lvl==="admin"?"Full admin":lvl==="read"?"Read only":"Officer"}</span></div></td>
            <td>
              <select style="width:100%;padding:8px 10px;border:1px solid ${isOut?"#E8D6AC":"var(--line)"};
                border-radius:7px;font-size:12.5px;background:${isOut?"#FBF5E7":"#fff"}"
                onchange="pickSeat(${i}, this.value)">
                <option value="">Select a brother…</option>
                <optgroup label="Cabuyao City — in jurisdiction">${ELIGIBLE.map(opt).join("")}</optgroup>
                <optgroup label="Outside jurisdiction — will be logged">${OUTSIDE.map(opt).join("")}</optgroup>
              </select>
              ${isOut?`<input placeholder="Reason — required, and recorded permanently"
                 style="width:100%;margin-top:6px;padding:7px 10px;border:1px solid #E8D6AC;
                 border-radius:6px;font-size:12px;background:#FBF5E7">`:""}
            </td>
            <td style="font-size:12px">
              ${picked?`${picked.ch}<div style="font-size:11px;color:${isOut?"var(--warn)":"var(--mute)"}">${picked.cty}${isOut?" · outside":""}</div>`
                      :`<span style="color:var(--mute)">—</span>`}
            </td>
            <td style="text-align:right">
              ${picked?`<span class="pill ${picked.cur?"p-ok":"p-bad"}">${picked.cur?"renewed":"lapsed"}</span>`
                      :`<span class="pill p-mute">unfilled</span>`}
            </td></tr>`;}).join("")}
      </table></div>

      ${(()=>{const n=Object.values(S.seats||{}).filter(Boolean).length;
        const lapsed=Object.values(S.seats||{}).filter(Boolean)
          .map(v=>[...ELIGIBLE,...OUTSIDE].find(m=>m.id===+v)).filter(m=>m&&!m.cur);
        const outs=Object.values(S.seats||{}).filter(Boolean)
          .map(v=>+v).filter(v=>!ELIGIBLE.some(m=>m.id===v));
        return `<div class="card" style="margin-top:12px"><div class="cp"
          style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
          <div><div style="font-size:11px;color:var(--mute)">Seats filled</div>
            <div class="num" style="font-size:19px;color:${n===6?"var(--in)":"var(--ink)"}">${n} of 6</div></div>
          <div style="flex:1;min-width:220px;font-size:12px;color:var(--slate);line-height:1.55">
            ${lapsed.length?`<span style="color:var(--out);font-weight:600">${lapsed.map(m=>m.gift).join(", ")} ${lapsed.length>1?"have":"has"} not renewed.</span>
               An officer who has lapsed would be approving other people's renewals while breaking the same rule.`
             :outs.length?`<span style="color:var(--warn);font-weight:600">${outs.length} seat${outs.length>1?"s":""} from outside Cabuyao.</span>
               Permitted, and each will be recorded with your name and the reason.`
             :n===6?`All six seats filled from Cabuyao chapters. Nothing to log.`
             :`31 members available across 4 Cabuyao chapters.`}
          </div>
        </div></div>`;})()}

      <div class="note bad" style="margin-top:12px"><b>Every officer field on this form is a dropdown.
        There is nowhere to type a name.</b> A council has no route into the register — only a chapter
        does, through a chapter registration or a Chapter Admin approving a sign-up. This form seats
        people; it enrols nobody.</div>
      <div class="note info" style="margin-top:12px"><b>The dropdown is filled from chapters in this
        council's jurisdiction.</b> A Cabuyao council officer is a member of a Cabuyao chapter.
        <br><br>
        Seating someone from outside is permitted — one chapter cannot supply six officers — but
        there is <b>no waiver and no approval step</b>. The seat is simply recorded with the name of
        whoever made it and the reason, permanently and visibly.
        <a onclick="go('attached')" style="color:var(--brass-dk);cursor:pointer;font-weight:600">See every such seat →</a></div>
    </div>

    <div>
      <div class="sl" style="margin-top:0">What a council can do</div>
      <div class="card"><table>
        ${COUNCIL_OFFICES.map(([o,d,lvl])=>`
          <tr><td><b style="font-size:12px">${o}</b>
            <div style="font-size:10.5px;color:var(--mute);margin-top:2px">${d}</div></td>
            <td style="text-align:right;vertical-align:top">
              <span class="pill ${lvl==="admin"?"p-ok":lvl==="read"?"p-warn":"p-info"}">
                ${lvl==="admin"?"Full admin":lvl==="read"?"Read only":"Officer"}</span></td></tr>`).join("")}
      </table></div>
      <div class="note" style="margin-top:12px">There are <b>no master initiators on a council</b>.
        That office belongs to a chapter's rite, not to a council's function. Copying the chapter
        roster wholesale would create three council seats with nothing to do.</div>

      <div class="sl">On approval</div>
      <div class="card"><div class="cp" style="font-size:12.5px;line-height:1.85;color:var(--slate)">
        1. The council is created beneath Laguna and appears in the registry.<br>
        2. It becomes selectable when a chapter registers under it.<br>
        3. Its six officers are seated with dated terms.<br>
        4. <b>The president receives a one-time enrolment link</b>, and seats the rest himself.<br>
        5. It inherits the national fee split and renewal calendar — a council sets neither.</div></div>

      <div class="btnrow" style="margin-top:16px">
        <button class="btn brass" onclick="alert('Submitted to Laguna Provincial Council.')">
          ${mode==="reconstitute"?"Submit reconstitution":"Submit registration"}</button>
        <button class="btn ghost" onclick="go('registry')">Cancel</button>
      </div>
      <div class="note" style="margin-top:12px"><b>No fee.</b> A council is not renewed and pays
        nothing to exist. Only members renew, and only chapters remit.</div>
    </div>
  </div>
</div>`;};

V.registry=()=>{
  const T=[
    [0,'National Council','National','—','#8E6D22','NC',1104,18430],
    [1,'Region IV-A · CALABARZON','Regional','5 provinces','#2E5C8A','IV',187,3210],
    [2,'Laguna Provincial Council','Provincial','12 cities and municipalities','#2E6B52','LG',73,1486],
    [3,'Sta. Rosa City Council','City/Municipal','14 chapters','#7A3E8F','SR',14,264],
    [4,'Brgy. San Isidro Chapter','Chapter','chartered 2005','#2E5C8A','SI',null,18],
    [4,'Brgy. Malitlit Chapter','Chapter','chartered 2009','#A6392E','ML',null,22],
    [4,'Brgy. Balibago Chapter','Chapter','chartered 2011','#2F5D63','BL',null,19],
  ];
  const DORMANT=[
    ['San Pedro City Council','City/Municipal','no seated officers since Aug 2026','10 chapters affected'],
    ['Quezon Provincial Council','Provincial','president deceased, no successor seated','4 city councils affected'],
  ];
  return portalTop()+crumb("Organization registry")+`<div class="body">
  <div class="h1">Organization registry</div>
  <div class="sub">One database, one address, one login page — and this tree is what tells the system
    who approves whom. A body cannot exist until the body above it does.</div>

  <div class="grid g4" style="margin-bottom:18px">
    <div class="tile dark"><div class="k">Chapters registered</div><div class="v">1,104</div><div class="d">nationwide</div></div>
    <div class="tile"><div class="k">Councils</div><div class="v">1,704</div><div class="d">17 regional · 81 provincial · 1,606 city</div></div>
    <div class="tile"><div class="k">Members on the rolls</div><div class="v">18,430</div><div class="d">across every chapter</div></div>
    <div class="tile"><div class="k">Awaiting registration</div><div class="v" style="color:var(--warn)">23</div><div class="d">14 chapters · 9 councils</div></div>
  </div>

  <div class="note info" style="margin-bottom:16px"><b>Read this tree downward, because that is the
    order it had to be built in.</b> A chapter cannot be registered until its city council exists;
    a city council cannot exist until its province does. Each body is the approving authority for
    the one beneath it — which is precisely why the levels must be seeded from the top before any
    pilot can start.</div>

  <div class="sl">The chain, from national to barangay</div>
  <div class="tree">
    ${T.map(([d,nm,lvl,sub,col,mk,ch,mem])=>`
      <div class="tnode" onclick="go('newChapter')">
        <div class="rail">${'<span class="stub"></span>'.repeat(d)}<span class="tick"></span><span class="stub"></span></div>
        <div class="chmark" style="background:${col}">${mk}</div>
        <div style="flex:1;min-width:0">
          <div class="lvl">${lvl}</div>
          <div class="nm">${nm}</div>
          <div class="sub">${sub}</div>
        </div>
        <div style="text-align:right">
          ${ch!==null?`<div class="num" style="font-size:13px">${ch} chapters</div>`:''}
          <div class="num" style="font-size:11px;color:var(--mute)">${mem} members</div>
        </div>
      </div>`).join("")}
  </div>

  <div class="sl">Councils needing attention</div>
  <div class="card"><table>
    <tr><th>Council</th><th>Level</th><th>Why</th><th>Impact</th><th></th></tr>
    ${DORMANT.map(([nm,lvl,why,imp])=>`
      <tr><td><b>${nm}</b></td><td>${lvl}</td>
        <td style="color:var(--slate)">${why}</td>
        <td><span class="pill p-bad">${imp}</span></td>
        <td style="text-align:right"><button class="btn ghost sm" onclick="S.councilMode='reconstitute';go('newCouncil')">Reconstitute</button></td></tr>`).join("")}
  </table></div>
  <div class="note bad" style="margin-top:12px"><b>A dormant council is not a cosmetic problem.</b>
    It is the approving body for everything beneath it, so ten chapters in San Pedro currently have
    nobody to approve their renewals. The escalation clock covers the delay — the province can act
    over the empty seat — but that is a workaround, not a fix. Reconstitute it.
    <br><br>
    <b>A council is never deleted.</b> If a jurisdiction is merged or reorganised, its chapters are
    reassigned to another council and the old row stays. Every renewal, receipt and approval ever
    made beneath it references that row forever.</div>

  <div class="note" style="margin-top:16px"><b>Each chapter has its own mark and colour.</b> The
    login page is identical for all 1,104 — before a brother signs in the system does not know who
    he is. From the moment he does, the app carries his chapter's mark. Uniform where it must be,
    his where it can be.</div>
  <div class="btnrow" style="margin-top:16px">
    <button class="btn brass" onclick="go('newChapter')">Register a new chapter</button>
    <button class="btn ghost" onclick="S.councilMode='constitute';go('newCouncil')">Register a new council</button>
  </div>
</div>`;};

        control, and it will be reused on the treasurer's account within a month.</div>
      <div style="font-size:12.5px;line-height:1.8;color:var(--slate)">

  <div class="btnrow" style="margin-top:18px">

/* ================= RENDER ================= */
function render(){
  const authed=!!S.role;
  const r = authed
    ? (V[S.r] ? S.r : "chSubmit")
    : (PUBLIC.includes(S.r) && V[S.r] ? S.r : "login");
  $("#page").innerHTML=V[r]();
  if(!authed){
    $("#nav").innerHTML =
      '<div class="rl">Portal</div>' +
      `<a class="${r==="login"?"on":""}" onclick="go('login')">Sign in</a>` +
      '<div class="rl">No account needed</div>' +
      `<a class="${r==="applyChapter"?"on":""}" onclick="go('applyChapter')">Chapter registration form</a>` +
      `<a class="${r==="applySubmitted"?"on":""}" onclick="go('applySubmitted')">After submitting</a>` +
      `<a class="${r==="petitionCouncil"?"on":""}" onclick="go('petitionCouncil')">Petition for a council</a>`;
    $("#roles").innerHTML='<div style="font-size:11.5px;color:var(--mute);line-height:1.5">Not signed in. The chapter registration form is open to everyone — that is the point of it.</div>';
  } else {
    const groups=[...NAV_BY_ROLE[S.role],DESIGN];
    $("#nav").innerHTML=groups.map(([g,items])=>`<div class="rl">${g}</div>`+
      items.map(([k,l])=>`<a class="${S.r===k?'on':''}" onclick="go('${k}')">${l}</a>`).join("")).join("")
      +'<div class="rl">Session</div><a onclick="signOut()">Sign out</a>';
    const [n,r2]=ROLES[S.role];
    $("#roles").innerHTML=`<div style="padding:8px 10px;border:1px solid #2E3846;border-radius:7px">
      <b style="color:var(--brass);font-size:12.5px;display:block">${n}</b>
      <span style="font-size:11px;color:#98A2B0">${r2}</span></div>`;
  }
  const m=META[r]||["","",""];
  $("#t").textContent=m[0];$("#d").textContent=m[1];$("#s").textContent=m[2];
  $("#cap").innerHTML = authed
    ? `Signed in as <b>${ROLES[S.role][1]}</b> — the menu on the left shows only what this office may do.`
    : `Sign in as any of the four offices to see the portal as that officer sees it.`;
}
render();
</script>

</html>
